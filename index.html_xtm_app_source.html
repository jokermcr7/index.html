<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XTM Stealth Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Space Grotesk', 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #050505; color: #f5f5f5; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
    .bg-grid {
      background-image: radial-gradient(rgba(255, 42, 68, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .neon-glow {
      box-shadow: 0 0 45px rgba(255, 42, 68, 0.45), inset 0 0 25px rgba(255, 42, 68, 0.25);
    }
    .pulse-ring {
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.2; }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating {
      animation: rotateRing 14s linear infinite;
    }
  </style>
</head>
<body class="bg-grid flex flex-col justify-between min-h-screen p-5 select-none">

  <!-- Header -->
  <header class="flex items-center justify-between pt-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-black border border-[#ff2a44]/50 flex items-center justify-center font-black text-[#ff2a44] text-lg shadow-[0_0_15px_rgba(255,42,68,0.4)]">
        X
      </div>
      <div>
        <div class="text-sm font-black tracking-widest text-[#ff2a44]">XTM CORE</div>
        <div class="text-[10px] text-neutral-400">STEALTH PROTOCOL v2.4</div>
      </div>
    </div>
    <div class="flex items-center gap-2 bg-neutral-900/90 border border-neutral-800 px-3 py-1.5 rounded-full text-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span class="text-neutral-300 font-mono text-[11px]">240Hz UHD</span>
    </div>
  </header>

  <!-- Core Sphere / Activation Area -->
  <main class="my-auto flex flex-col items-center justify-center text-center py-6">
    <div class="relative flex items-center justify-center cursor-pointer group" onclick="toggleConnect()">
      <!-- Outer Orbit Rings -->
      <div class="absolute w-64 h-64 rounded-full border border-dashed border-[#ff2a44]/30 rotating"></div>
      <div class="absolute w-56 h-56 rounded-full border border-[#ff2a44]/20 pulse-ring"></div>

      <!-- Main Button -->
      <div id="coreSphere" class="w-48 h-48 rounded-full bg-gradient-to-b from-[#180306] via-[#090203] to-[#000000] border-2 border-[#ff2a44] neon-glow flex flex-col items-center justify-center transition-all duration-300 active:scale-95">
        <svg id="powerIcon" class="w-14 h-14 text-[#ff2a44] mb-2 filter drop-shadow-[0_0_10px_#ff2a44]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span id="connectText" class="text-xs font-black tracking-widest text-[#ff2a44]">TAP TO CONNECT</span>
        <span id="connTimer" class="text-[11px] font-mono text-neutral-500 mt-1">00:00:00</span>
      </div>
    </div>

    <!-- Active Protocol & Node Info -->
    <div class="mt-8 bg-neutral-950/80 border border-neutral-800/80 backdrop-blur-md px-5 py-3 rounded-2xl flex items-center gap-4">
      <div class="w-3 h-3 rounded-full bg-[#ff2a44] shadow-[0_0_8px_#ff2a44]"></div>
      <div class="text-right">
        <div class="text-xs font-bold text-neutral-200">Frankfurt HighSpeed #04</div>
        <div class="text-[10px] text-neutral-500 font-mono">HYSTERIA 2 • UDP QUIC • PORT 443</div>
      </div>
      <span class="text-xs font-mono text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-md">38ms</span>
    </div>
  </main>

  <!-- Metrics HUD Bar -->
  <section class="grid grid-cols-3 gap-2.5 mb-2">
    <div class="bg-neutral-950/90 border border-neutral-800/70 p-3 rounded-xl text-center">
      <div class="text-[10px] text-neutral-400 mb-0.5">پینگ زنده</div>
      <div class="text-sm font-mono font-black text-emerald-400" id="livePing">38 ms</div>
    </div>
    <div class="bg-neutral-950/90 border border-neutral-800/70 p-3 rounded-xl text-center">
      <div class="text-[10px] text-neutral-400 mb-0.5">دانلود</div>
      <div class="text-sm font-mono font-black text-[#ff2a44]" id="dlSpeed">14.8 MB/s</div>
    </div>
    <div class="bg-neutral-950/90 border border-neutral-800/70 p-3 rounded-xl text-center">
      <div class="text-[10px] text-neutral-400 mb-0.5">آپلود</div>
      <div class="text-sm font-mono font-black text-neutral-200" id="ulSpeed">4.2 MB/s</div>
    </div>
  </section>

  <!-- Navigation / Action Dock -->
  <nav class="bg-black/90 border border-neutral-800 px-6 py-3.5 rounded-full flex items-center justify-between text-neutral-400">
    <button class="text-[#ff2a44] font-bold text-xs flex items-center gap-1.5">
      <span>●</span> خانه
    </button>
    <button class="hover:text-white text-xs">سرورها (54)</button>
    <button class="hover:text-white text-xs">اسکن QR</button>
    <button class="hover:text-white text-xs">تنظیمات</button>
  </nav>

  <script>
    let isConnected = false;
    let timerInterval = null;
    let seconds = 0;

    function toggleConnect() {
      isConnected = !isConnected;
      const sphere = document.getElementById('coreSphere');
      const text = document.getElementById('connectText');
      const icon = document.getElementById('powerIcon');

      if (isConnected) {
        sphere.classList.remove('border-[#ff2a44]');
        sphere.classList.add('border-emerald-500');
        sphere.style.boxShadow = '0 0 50px rgba(16, 185, 129, 0.5), inset 0 0 25px rgba(16, 185, 129, 0.3)';
        text.innerText = 'DISCONNECT';
        text.classList.remove('text-[#ff2a44]');
        text.classList.add('text-emerald-400');
        icon.classList.remove('text-[#ff2a44]');
        icon.classList.add('text-emerald-400');

        timerInterval = setInterval(() => {
          seconds++;
          const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
          const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          document.getElementById('connTimer').innerText = `${h}:${m}:${s}`;
        }, 1000);
      } else {
        sphere.classList.remove('border-emerald-500');
        sphere.classList.add('border-[#ff2a44]');
        sphere.style.boxShadow = '';
        text.innerText = 'TAP TO CONNECT';
        text.classList.remove('text-emerald-400');
        text.classList.add('text-[#ff2a44]');
        icon.classList.remove('text-emerald-400');
        icon.classList.add('text-[#ff2a44]');
        clearInterval(timerInterval);
        seconds = 0;
        document.getElementById('connTimer').innerText = '00:00:00';
      }
    }
  </script>
</body>
</html>
